<!DOCTYPE html>
<html>
<title>Tag</title>
<head>
<link rel="stylesheet" href="styles.css" type="text/css">
</head>
<body>

<div>
<table>
<tr>
<td><button onclick="analyse(this)">A</button></td>
<td><button onclick="analyse(this)">B</button></td>
<td><button onclick="analyse(this)">C</button></td>
<td><button onclick="analyse(this)">D</button></td>
</tr>

<tr>
<td><button onclick="analyse(this)">E</button></td>
<td><button onclick="analyse(this)">F</button></td>
<td><button onclick="analyse(this)">G</button></td>
<td><button onclick="analyse(this)">H</button></td>
</tr>

<tr>
<td><button onclick="analyse(this)">I</button></td>
<td><button onclick="analyse(this)">J</button></td>
<td><button onclick="analyse(this)">K</button></td>
<td><button onclick="analyse(this)">L</button></td>
</tr>

<tr>
<td><button onclick="analyse(this)">M</button></td>
<td><button onclick="analyse(this)">N</button></td>
<td><button onclick="analyse(this)">O</button></td>
<td><button onclick="analyse(this)">P</button></td>
</tr>
</table>
</div>

<div id="dialogOverlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.4);">
    <div id="dialogBox" style="background:white; padding:20px; width:300px; margin:150px auto; display:none;">
        <p id="dialogMessage"></p>
        <input id="answerInput" type="text">
        <button id="dialogOkBtn">OK</button>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>

questions = [
 "What is the capital of France",
 "What is the capital of Germany",
 "What is the capital of Iran",
 "What is the capital of Ethiopia",
 "What is the capital of India",
 "What is the capital of North Korea",
 "What is the capital of Japan",
 "What is the capital of USA"
]

const socket = io();
let myLetter = null;

let players = {};
let id = "player1";
players[id] = { frozen:false };

socket.on('assigned', (data) => {
    myLetter = data.letter;
    document.title = `You are ${myLetter}`;
});

function get() {
    const randomIndex = Math.floor(Math.random() * questions.length);
    return questions[randomIndex];
}

function showDialog(message, callback) {
    const overlay = document.getElementById('dialogOverlay');
    const dialog = document.getElementById('dialogBox');
    const dialogMessage = document.getElementById('dialogMessage');
    const answerInput = document.getElementById('answerInput');
    const okBtn = document.getElementById('dialogOkBtn');

    dialogMessage.textContent = message;
    answerInput.value = '';
    overlay.style.display = 'block';
    dialog.style.display = 'block';
    answerInput.focus();

    okBtn.onclick = () => {
        const userAnswer = answerInput.value.trim();
        callback(userAnswer);
    };
}

function closeDialog() {
    document.getElementById('dialogOverlay').style.display = 'none';
    document.getElementById('dialogBox').style.display = 'none';
}


function analyse(button) {

    const buttonText = button.textContent.trim();

    if (buttonText == myLetter) {

        players[id].frozen = true;

        const question = get();

        function checkAnswer(userAnswer) {

            
            if (question == "What is the capital of France") {
                if (userAnswer == "Paris") {
                    players[id].frozen = false;
                    closeDialog();
                    return;
                } else {
                    alert("INCORRECT! PLEASE TRY AGAIN");
                    showDialog("You have been freezed. Please solve the question to continue: " + question, checkAnswer);
                }
            }

           
            if (question == "What is the capital of Germany") {
                if (userAnswer == "Berlin") {
                    players[id].frozen = false;
                    closeDialog();
                    return;
                } else {
                    alert("INCORRECT! PLEASE TRY AGAIN");
                    showDialog("You have been freezed. Please solve the question to continue: " + question, checkAnswer);
                }
            }

            
            if (question == "What is the capital of Iran") {
                if (userAnswer == "Tehran") {
                    players[id].frozen = false;
                    closeDialog();
                    return;
                } else {
                    alert("INCORRECT! PLEASE TRY AGAIN");
                    showDialog("You have been freezed. Please solve the question to continue: " + question, checkAnswer);
                }
            }

            if (question == "What is the capital of Ethiopia") {
                if (userAnswer == "Addis Ababa") {
                    players[id].frozen = false;
                    closeDialog();
                    return;
                } else {
                    alert("INCORRECT! PLEASE TRY AGAIN");
                    showDialog("You have been freezed. Please solve the question to continue: " + question, checkAnswer);
                }
            }

            
            if (question == "What is the capital of India") {
                if (userAnswer == "New Delhi") {
                    players[id].frozen = false;
                    closeDialog();
                    return;
                } else {
                    alert("INCORRECT! PLEASE TRY AGAIN");
                    showDialog("You have been freezed. Please solve the question to continue: " + question, checkAnswer);
                }
            }

          
            if (question == "What is the capital of North Korea") {
                if (userAnswer == "Pyongyang") {
                    players[id].frozen = false;
                    closeDialog();
                    return;
                } else {
                    alert("INCORRECT! PLEASE TRY AGAIN");
                    showDialog("You have been freezed. Please solve the question to continue: " + question, checkAnswer);
                }
            }

           
            if (question == "What is the capital of Japan") {
                if (userAnswer == "Tokyo") {
                    players[id].frozen = false;
                    closeDialog();
                    return;
                } else {
                    alert("INCORRECT! PLEASE TRY AGAIN");
                    showDialog("You have been freezed. Please solve the question to continue: " + question, checkAnswer);
                }
            }

           
            if (question == "What is the capital of USA") {
                if (userAnswer == "Washington DC") {
                    players[id].frozen = false;
                    closeDialog();
                    return;
                } else {
                    alert("INCORRECT! PLEASE TRY AGAIN");
                    showDialog("You have been freezed. Please solve the question to continue: " + question, checkAnswer);
                }
            }
        }

        showDialog("You have been freezed. Please solve the question to continue: " + question, checkAnswer);
    }
}

</script>
</body>
</html>
