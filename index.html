<!DOCTYPE html>
<html>
<title>Tag</title>
<head>
<link rel="stylesheet" href="styles.css" type="text/css">
</head>
<body>

<div>
<table>
<tr>
<td><button onclick="analyse(this)">A</button></td>
<td><button onclick="analyse(this)">B</button></td>
<td><button onclick="analyse(this)">C</button></td>
<td><button onclick="analyse(this)">D</button></td>
</tr>

<tr>
<td><button onclick="analyse(this)">E</button></td>
<td><button onclick="analyse(this)">F</button></td>
<td><button onclick="analyse(this)">G</button></td>
<td><button onclick="analyse(this)">H</button></td>
</tr>

<tr>
<td><button onclick="analyse(this)">I</button></td>
<td><button onclick="analyse(this)">J</button></td>
<td><button onclick="analyse(this)">K</button></td>
<td><button onclick="analyse(this)">L</button></td>
</tr>

<tr>
<td><button onclick="analyse(this)">M</button></td>
<td><button onclick="analyse(this)">N</button></td>
<td><button onclick="analyse(this)">O</button></td>
<td><button onclick="analyse(this)">P</button></td>
</tr>
</table>
</div>

<div id="dialogOverlay"  style="display:none; position:fixed; width:50%; height:50%; background:rgba(0,0,0,0.4); display:flex; justify-content:center; align-items:center;">
    <div id="dialogBox" style="background:white; padding:20px; width:300px; border-radius:10px; text-align:center;">
        <p id="dialogMessage"></p>
        <input id="answerInput" type="text">
        <button id="dialogOkBtn">OK</button>
    </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>


const questions = [
 "What is the capital of France",
 "What is the capital of Germany",
 "What is the capital of Iran",
 "What is the capital of Ethiopia",
 "What is the capital of India",
 "What is the capital of North Korea",
 "What is the capital of Japan",
 "What is the capital of USA"
];

function getQuestion() {
    return questions[Math.floor(Math.random() * questions.length)];
}

const socket = io();
let myLetter = null;
let players = {};
let id = null; 

socket.on('connect', () => {
    id = socket.id; 
    console.log('My unique ID is:', id); 
});

socket.on('assigned', (data) => {
    myLetter = data.letter;
    document.title = `You are ${myLetter}`;
});

socket.on("update", (updatedPlayers) => {

    players = updatedPlayers;

    if (players[id] && players[id].frozen === true) {
        askQuestionToUnfreeze();
    }
});

function showDialog(message, callback) {
    document.getElementById('dialogMessage').textContent = message;
    document.getElementById('answerInput').value = "";
    document.getElementById('dialogOverlay').style.display = 'block';
    document.getElementById('dialogBox').style.display = 'block';

    document.getElementById('dialogOkBtn').onclick = () => {
        callback(document.getElementById('answerInput').value.trim());
    };
}

function closeDialog() {
    document.getElementById('dialogOverlay').style.display = 'none';
    document.getElementById('dialogBox').style.display = 'none';
}


function askQuestionToUnfreeze() {

    const question = getQuestion();

    function checkAnswer(ans) {

        let correct =
            (question == "What is the capital of France" && ans == "Paris") ||
            (question == "What is the capital of Germany" && ans == "Berlin") ||
            (question == "What is the capital of Iran" && ans == "Tehran") ||
            (question == "What is the capital of Ethiopia" && ans == "Addis Ababa") ||
            (question == "What is the capital of India" && ans == "New Delhi") ||
            (question == "What is the capital of North Korea" && ans == "Pyongyang") ||
            (question == "What is the capital of Japan" && ans == "Tokyo") ||
            (question == "What is the capital of USA" && ans == "Washington DC");

        if (correct) {
            players[id].frozen = false;
            closeDialog();
        } else {
            alert("Incorrect! Try again.");
            showDialog("You have been frozen. Solve: " + question, checkAnswer);
        }
    }

    showDialog("You have been frozen. Solve: " + question, checkAnswer);
}


function analyse(button) {
    
    const buttonText = button.textContent.trim();

    if (buttonText === myLetter) return;

    let opponent = false;
    for (let pid in players) {
        if (players[pid].letter === buttonText) {
            opponent = true;
            break;
        }
    }

    if (opponent) {
        socket.emit("freezePlayer", { letter: buttonText });
        return;
    }
}

</script>
</body>
</html>
