<!DOCTYPE html>
<html>
  <head><link rel="stylesheet" href="styles.css"></head>
<body>
  <div>
     Enter any username:<input id="inp" type="text">
    <button onclick="execute()">SUBMIT</button>
  </div>
<script>
 function execute() {
    const name = document.getElementById("inp").value;

    fetch("/add_player", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({name: name})
    }).then(() => loadPlayers());
   window.location.href="index1.html";
}

function loadPlayers() {
    fetch("/get_players")
    .then(res => res.json())
    .then(data => {
        const table = document.getElementById("playerTable");
        table.innerHTML = "<tr><th>Players</th></tr>";
        data.forEach(p => {
            table.innerHTML += `<tr><td>${p.name}</td></tr>`;
        });
    });
}

window.onload = loadPlayers;

  
</script>
</body>
</html>
