<div id="dialogOverlay"
     style="display:none; position:fixed; width:100%; height:100%; background:rgba(0,0,0,0.4);
     justify-content:center; align-items:center;">
  <div id="dialogBox"
       style="background:white; padding:20px; width:600px; border-radius:10px; text-align:center;">
      <p id="dialogMessage"></p>
      <input id="answerInput" type="text">
      <button id="dialogOkBtn">OK</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>

const questions = [
 "What is the capital of France",
 "What is the capital of Germany",
 "What is the capital of Iran",
 "What is the capital of Ethiopia",
 "What is the capital of India",
 "What is the capital of North Korea",
 "What is the capital of Japan",
 "What is the capital of USA"
];

const answers = {
 "What is the capital of France": "Paris",
 "What is the capital of Germany": "Berlin",
 "What is the capital of Iran": "Tehran",
 "What is the capital of Ethiopia": "Addis Ababa",
 "What is the capital of India": "New Delhi",
 "What is the capital of North Korea": "Pyongyang",
 "What is the capital of Japan": "Tokyo",
 "What is the capital of USA": "Washington DC"
};

const socket = io();
let myLetter = null;
let players = {};
let id = null;

socket.on('connect', () => id = socket.id);

socket.on('assigned', (data) => {
  myLetter = data.letter;
  document.title = `You are ${myLetter}`;
});

socket.on("update", (updatedPlayers) => {
  players = updatedPlayers;
  if (players[id] && players[id].frozen) askQuestionToUnfreeze();
});

function getQuestion() {
    return questions[Math.floor(Math.random() * questions.length)];
}

function showDialog(message, callback) {
  document.getElementById('dialogMessage').textContent = message;
  document.getElementById('answerInput').value = "";
  document.getElementById('dialogOverlay').style.display = 'flex';
  document.getElementById('dialogOkBtn').onclick = () =>
     callback(document.getElementById('answerInput').value.trim());
}

function closeDialog() {
  document.getElementById('dialogOverlay').style.display = 'none';
}

function askQuestionToUnfreeze() {
  const q = getQuestion();

  function checkAnswer(ans) {
    if (ans === answers[q]) {
      socket.emit("unfreezePlayer", { letter: myLetter });
      players[id].frozen = false;
      socket.emit("freezealpha", { letter: clicked });   
      closeDialog();
    } else {
      alert("Incorrect! Try again.");
      showDialog("You have been frozen. Solve: " + q, checkAnswer);
    }
  }

  showDialog("You have been frozen. Solve: " + q, checkAnswer);
}

function analyse(button) {
  const clicked = button.textContent.trim();
  if (clicked === myLetter) return;

  const exists = Object.values(players).some(p => p.letter === clicked);

  if (exists) { 
    players[id].frozen = true;
    socket.emit("freezePlayer", { letter: clicked });   
    socket.emit("unfreezealpha", { letter: clicked });  
  } 
 }
</script>
